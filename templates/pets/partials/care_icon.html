{# Round icon for a care section. kind = "feeding", "medication" or "emergency". #}
<span class="care-icon care-icon-{{ kind }}" aria-hidden="true">
  {% if kind == "feeding" %}
    <svg viewBox="0 0 24 24" focusable="false"><path d="M3.5 11h17a8.5 6.5 0 0 1-17 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 7.5c.8-1.6 2.3-2.5 4-2.5s3.2.9 4 2.5M12 5V3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  {% elif kind == "medication" %}
    <svg viewBox="0 0 24 24" focusable="false"><rect x="2.8" y="8.2" width="18.4" height="7.6" rx="3.8" transform="rotate(-45 12 12)" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.3 9.3l5.4 5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  {% else %}
    <svg viewBox="0 0 24 24" focusable="false"><rect x="3.5" y="7" width="17" height="12.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M12 10.5v5.5M9.25 13.25h5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  {% endif %}
</span>
